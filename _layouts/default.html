<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <style>
      .wrapper { width: 90%; max-width: 1400px; }
      header { width: 18%; min-width: 180px; }
      section { width: 76%; }
      @media (max-width: 768px) {
        header, section { width: 100%; float: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
        {% if site.description %}<p>{{ site.description }}</p>{% endif %}
      </header>
      <section>
        {% unless page.url == "/" or page.url == "/index.html" %}
        <p><a href="{{ "/" | relative_url }}">← All articles</a></p>
        {% endunless %}
        {{ content }}
      </section>
      <footer>
        <p>{{ site.name }}</p>
      </footer>
    </div>
  </body>
</html>
